<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="eNSP MCP 控制台：设备扫描、知识库、拓扑管理与终端操作一体化界面。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; frame-ancestors 'self';">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>eNSP MCP</title>
  <style>
    :root {
      --bg-base: #1e1e2e;
      --bg-panel: #181825;
      --bg-input: #11111b;
      --border: #313244;
      --text-primary: #cdd6f4;
      --text-muted: #6c7086;
      --accent-blue: #89b4fa;
      --accent-green: #a6e3a1;
      --accent-yellow: #f9e2af;
      --accent-red: #f38ba8;
      --accent-purple: #cba6f7;
      --radius-sm: 4px;
      --radius-md: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-base); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .hdr { padding: 10px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .hdr h1 { font-size: 14px; }
    .hl { display: flex; align-items: center; gap: 8px; }
    .hr { display: flex; align-items: center; gap: 6px; }
    .btn { border: none; padding: 5px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: 11px; line-height: 1.4; }
    .btn:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }
    .btn-scan { background: var(--accent-blue); color: var(--bg-base); }
    .btn-upload { background: var(--accent-green); color: var(--bg-base); }
    .btn-nav { background: var(--border); color: var(--text-primary); }
    .btn-nav.active { background: var(--accent-blue); color: var(--bg-base); }
    .btn-refresh { background: var(--border); color: var(--text-primary); font-size: 10px; padding: 4px 8px; }
    .btn:hover { opacity: 0.85; }
    #topoIn { display: none; }
    .topo-ind { font-size: 11px; color: var(--accent-green); }
    .content { flex: 1; display: flex; overflow: hidden; }
    .sidebar { width: 240px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .pr { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; align-items: center; }
    .pr input { width: 50px; background: var(--bg-input); border: 1px solid var(--border); padding: 4px; border-radius: var(--radius-sm); color: var(--text-primary); font-size: 11px; }
    .dl { flex: 1; overflow-y: auto; padding: 6px; }
    .di { padding: 8px; margin-bottom: 4px; background: var(--bg-input); border-radius: var(--radius-md); display: flex; flex-direction: column; gap: 4px; border-left: 3px solid transparent; }
    .di:hover { background: var(--bg-panel); }
    .di.connected { border-left-color: var(--accent-green); }
    .di.unresponsive { border-left-color: var(--accent-yellow); }
    .dh { display: flex; justify-content: space-between; align-items: center; }
    .dinf { flex: 1; }
    .dn { font-size: 12px; display: flex; align-items: center; gap: 4px; }
    .dn .ei { opacity: 0; cursor: pointer; font-size: 10px; }
    .dn:hover .ei { opacity: 1; }
    .dm { display: flex; gap: 8px; align-items: center; margin-top: 2px; }
    .dp { font-size: 10px; color: var(--text-muted); }
    .dt { font-size: 9px; padding: 1px 4px; border-radius: 3px; background: var(--border); color: var(--accent-blue); }
    .hb { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .hb.alive { background: var(--accent-green); }
    .hb.unresponsive { background: var(--accent-yellow); }
    .hb.dead { background: var(--accent-red); }
    .dar { display: flex; gap: 4px; justify-content: flex-end; }
    .cb { background: var(--accent-green); padding: 3px 8px; border-radius: var(--radius-sm); cursor: pointer; color: var(--bg-base); font-size: 10px; flex: 1; border: none; }
    .cbg { background: var(--border); color: var(--accent-green); padding: 3px 8px; border-radius: var(--radius-sm); font-size: 10px; cursor: pointer; flex: 1; text-align: center; border: none; }
    .rnb { background: var(--border); border: none; padding: 3px 6px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-muted); font-size: 9px; }
    .fnb { background: var(--border); border: none; padding: 3px 6px; border-radius: var(--radius-sm); cursor: pointer; color: var(--accent-yellow); font-size: 9px; }
    .db { background: var(--accent-red); border: none; padding: 3px 8px; border-radius: var(--radius-sm); cursor: pointer; color: var(--bg-base); font-size: 10px; width: 100%; margin-top: 2px; }
    .ma { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .tabs { background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; padding: 0 8px; overflow-x: auto; min-height: 36px; }
    .tab { padding: 8px 14px; font-size: 11px; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .tab:hover { color: var(--text-primary); }
    .tab.active { color: var(--text-primary); border-bottom-color: var(--accent-blue); }
    .tab .cls { width: 14px; height: 14px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 9px; flex-shrink: 0; border: none; color: var(--text-muted); cursor: pointer; }
    .tab .cls:hover { background: var(--accent-red); color: var(--bg-base); }
    .et { padding: 8px 14px; font-size: 11px; color: var(--text-muted); }
    .terminals { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .tp { background: var(--bg-input); border-radius: var(--radius-md); display: none; flex-direction: column; height: 300px; overflow: hidden; }
    .tp.active { display: flex; }
    .th { padding: 6px 12px; background: var(--bg-panel); border-bottom: 1px solid var(--border); font-size: 11px; color: var(--accent-blue); display: flex; justify-content: space-between; align-items: center; }
    .th .ri { opacity: 0; cursor: pointer; font-size: 10px; }
    .th:hover .ri { opacity: 1; }
    .tb { flex: 1; padding: 10px; overflow-y: auto; font-family: Consolas, monospace; font-size: 11px; line-height: 1.5; }
    .tb .output { color: var(--accent-green); white-space: pre-wrap; word-break: break-all; }
    .tb .input { color: var(--accent-blue); white-space: pre-wrap; }
    .tb .error { color: var(--accent-red); }
    .tb .system { color: var(--text-muted); font-style: italic; }
    .ti { display: flex; padding: 6px 12px; gap: 8px; border-top: 1px solid var(--border); background: var(--bg-panel); }
    .ti .pm { color: var(--accent-green); font-size: 11px; font-family: Consolas, monospace; }
    .ti input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-family: Consolas, monospace; font-size: 11px; }
    .logs { height: 120px; background: var(--bg-panel); border-top: 1px solid var(--border); overflow-y: auto; padding: 6px 10px; font-size: 10px; color: var(--text-muted); }
    .logs .success { color: var(--accent-green); }
    .logs .error { color: var(--accent-red); }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .mc { background: var(--bg-base); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; min-width: 300px; }
    .mt { font-size: 13px; color: var(--text-primary); margin-bottom: 10px; }
    .mi { width: 100%; padding: 6px 10px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 12px; margin-bottom: 12px; }
    .mb { display: flex; gap: 8px; justify-content: flex-end; }
    .mbtn { padding: 5px 14px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-size: 12px; }
    .mbtn.cancel { background: var(--border); color: var(--text-primary); }
    .mbtn.confirm { background: var(--accent-blue); color: var(--bg-base); }
    .sp { display: none; flex: 1; padding: 12px; overflow: auto; }
    .sp.active { display: block; }
    .cat-cmd { margin-bottom: 12px; }
    .cmd-name { font-size: 12px; font-weight: 600; color: var(--accent-blue); }
    .cmd-desc { font-size: 11px; color: var(--text-muted); }
    .cmd-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .cmd-tag { font-size: 9px; padding: 1px 4px; border-radius: 3px; background: var(--border); color: var(--text-muted); }
    .cap-card { margin-bottom: 10px; }
    .cap-title { font-size: 12px; color: var(--accent-blue); }
    .kb-page { display: flex; flex-direction: column; gap: 12px; }
    .kb-stats { display: flex; gap: 10px; }
    .kb-stat { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px; flex: 1; text-align: center; }
    .kb-stat .num { font-size: 16px; color: var(--accent-blue); }
    .kb-stat .lbl { font-size: 10px; color: var(--text-muted); }
    .kb-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .kb-tab { padding: 4px 10px; font-size: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-panel); color: var(--text-muted); cursor: pointer; }
    .kb-tab:hover { color: var(--text-primary); }
    .kb-tab.active { background: var(--accent-purple); color: var(--bg-base); border-color: var(--accent-purple); }
    .kb-section { display: none; }
    .kb-section.active { display: block; }
    .device-sel { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .device-sel-btn { padding: 3px 8px; font-size: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-input); color: var(--text-muted); cursor: pointer; }
    .device-sel-btn:hover { color: var(--text-primary); }
    .device-sel-btn.active { background: var(--accent-purple); color: var(--bg-base); border-color: var(--accent-purple); }
    .view-sel { display: flex; gap: 6px; margin-bottom: 8px; }
    .view-sel-btn { padding: 3px 8px; font-size: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-panel); color: var(--text-muted); cursor: pointer; }
    .view-sel-btn:hover { color: var(--text-primary); }
    .view-sel-btn.active { background: var(--accent-purple); color: var(--bg-base); border-color: var(--accent-purple); }
    .kb-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px; margin-bottom: 8px; }
    .kb-card-title { font-size: 12px; color: var(--accent-blue); margin-bottom: 4px; }
    .kb-card-body { font-size: 11px; color: var(--text-muted); }
    .cmd-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px; margin-bottom: 8px; }
    .cmd-title { font-size: 12px; color: var(--accent-blue); margin-bottom: 4px; }
    .cmd-meta { font-size: 10px; color: var(--text-muted); display: flex; gap: 10px; margin-bottom: 6px; }
    .cmd-output { font-family: Consolas, monospace; font-size: 11px; background: var(--bg-input); border-radius: var(--radius-sm); padding: 8px; margin-top: 6px; white-space: pre-wrap; color: var(--text-primary); }
    .filter-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .filter-row select, .filter-row input { padding: 4px 8px; font-size: 11px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); }
    .cmd-list { display: flex; flex-direction: column; gap: 6px; }
    .cmd-item { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px; }
    .cmd-item-title { font-size: 12px; color: var(--accent-blue); }
    .topo-info { margin-top: 8px; font-size: 11px; color: var(--text-muted); }
    .node { font-size: 10px; padding: 2px 6px; background: var(--border); border-radius: 999px; color: var(--text-primary); }
    .resizer { width: 4px; cursor: col-resize; background: var(--border); flex-shrink: 0; }
    .resizer:hover { background: var(--accent-blue); }
    .device-actions { display: none; gap: 6px; align-items: center; flex-wrap: wrap; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--text-primary); border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 980px) {
      .content { flex-direction: column; }
      .sidebar { width: 100%; border-right: 0; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <noscript>
    <div style="padding:24px;background:#27272a;color:#fff;text-align:center;">
      当前浏览器未启用 JavaScript，请启用后刷新页面以使用 eNSP MCP 控制台。
    </div>
  </noscript>
  <header class="hdr" role="banner">
    <div class="hl">
      <h1>eNSP MCP</h1>
      <button class="btn btn-scan" id="scanDevicesBtn">扫描</button>
      <label class="btn btn-upload" id="uploadTopoLabel">
        上传拓扑
        <input type="file" id="topoIn" accept=".json,.txt,.xml,.topo,.yml,.yaml,.csv,.cfg,.conf">
      </label>
      <span id="topoInd" class="topo-ind"></span>
    </div>
    <div class="hr">
      <button class="btn btn-nav" id="nCat" data-action="switch-section" data-target="cat">命令目录</button>
      <button class="btn btn-nav" id="nCap" data-action="switch-section" data-target="cap">设备能力</button>
      <button class="btn btn-nav" id="nKb" data-action="switch-section" data-target="kb">知识库</button>
      <button class="btn btn-nav" id="nTopo" data-action="switch-section" data-target="topo">拓扑</button>
    </div>
  </header>
  <div class="content">
    <aside class="sidebar" role="navigation" aria-label="设备列表">
      <div class="pr">
        <input type="text" id="ipStart" value="192.168.1.1">
        <input type="text" id="ipEnd" value="192.168.1.254">
        <button class="btn btn-refresh" id="refreshBtn">刷新</button>
      </div>
      <div class="dl" id="deviceList"></div>
    </aside>
    <div class="resizer" id="sidebarResizer"></div>
    <main class="ma" role="main">
      <div class="tabs" role="tablist" aria-label="终端标签"></div>
      <div class="terminals" id="terminals"></div>
      <div class="device-actions" id="deviceActions">
        <button class="btn btn-scan" id="doBatchCmdBtn">批量命令</button>
        <button class="btn btn-scan" id="doSuggestNextBtn">建议下一步</button>
                      </div>
      <div class="sp" id="vCat"><div id="catContent"></div></div>
      <div class="sp" id="vCap">
        <div class="filter-row">
          <select id="capDeviceType" aria-label="设备类型"><option value="">全部类型</option><option value="huawei">华为</option><option value="h3c">H3C</option><option value="cisco">思科</option><option value="juniper">瞻博</option></select>
          <select id="capRisk" aria-label="风险等级"><option value="">全部风险</option><option value="safe">安全</option><option value="moderate">中等</option><option value="high">高</option></select>
          <button class="btn btn-scan" id="loadCapBtn">筛选</button>
        </div>
        <div id="capContent"></div>
      </div>
      <div class="sp" id="vKb">
        <div class="kb-page">
          <div class="kb-stats">
            <div class="kb-stat"><div class="num" id="kbCmdCount">0</div><div class="lbl">结构化命令</div></div>
            <div class="kb-stat"><div class="num" id="kbExpCount">0</div><div class="lbl">实验经验</div></div>
            <div class="kb-stat"><div class="num" id="kbTsCount">0</div><div class="lbl">排障案例</div></div>
          </div>
          <nav class="kb-tabs" aria-label="知识库标签">
            <div class="kb-tab active" data-action="switch-kb-tab" data-target="structured">结构化命令</div>
            <div class="kb-tab" data-action="switch-kb-tab" data-target="bestpractice">操作规范</div>
            <div class="kb-tab" data-action="switch-kb-tab" data-target="experience">实验经验</div>
            <div class="kb-tab" data-action="switch-kb-tab" data-target="troubleshoot">排障知识</div>
            <div class="kb-tab" data-action="switch-kb-tab" data-target="configorder">配置顺序</div>
            <div class="kb-tab" data-action="switch-kb-tab" data-target="runtime">运行时记录</div>
            <div class="kb-tab" data-action="switch-kb-tab" data-target="search">搜索</div>
            <div class="kb-tab" data-action="switch-kb-tab" data-target="templates">配置模板</div>
            <div class="kb-tab" data-action="switch-kb-tab" data-target="report">实验报告</div>
          </nav>
          <div class="kb-section active" id="kbStructured">
            <div class="device-sel" id="kbDeviceSel"></div>
            <div class="view-sel">
              <div class="view-sel-btn active" data-action="switch-kb-view" data-target="both">全部视图</div>
              <div class="view-sel-btn" data-action="switch-kb-view" data-target="user_view">用户视图 &lt;&gt;</div>
              <div class="view-sel-btn" data-action="switch-kb-view" data-target="system_view">系统视图 []</div>
            </div>
            <div id="kbStructuredContent"></div>
          </div>
          <div class="kb-section" id="kbBestpractice"><div id="kbBpContent"></div></div>
          <div class="kb-section" id="kbExperience"><div id="kbExpContent"></div></div>
          <div class="kb-section" id="kbTroubleshoot"><div id="kbTsContent"></div></div>
          <div class="kb-section" id="kbConfigorder"><div id="kbCoContent"></div></div>
          <div class="kb-section" id="kbSearch">
            <div class="filter-row">
              <input type="text" id="kbSearchInput" placeholder="搜索命令、排障经验..." aria-label="知识库搜索">
              <button class="btn btn-scan" id="kbSearchBtn">搜索</button>
            </div>
            <div id="kbSearchContent"></div>
          </div>
          <div class="kb-section" id="kbTemplates">
            <div class="filter-row">
              <select id="kbTplType" aria-label="模板类型"><option value="vlan">VLAN</option><option value="vrrp">VRRP</option><option value="mstp">MSTP</option><option value="dhcp">DHCP</option><option value="ospf">OSPF</option><option value="lacp">LACP</option><option value="wlan">WLAN</option></select>
              <button class="btn btn-scan" id="loadKbTemplateBtn">生成模板</button>
            </div>
            <div id="kbTemplateContent"></div>
          </div>
          <div class="kb-section" id="kbReport">
            <div class="filter-row">
              <input type="text" id="kbReportName" value="eNSP Lab Report" aria-label="实验报告名称">
              <button class="btn btn-scan" id="genLabReportBtn">生成报告</button>
            </div>
            <div id="kbReportContent"></div>
          </div>
          <div class="kb-section" id="kbRuntime">
            <div class="filter-row">
              <select id="kbCatF" aria-label="命令分类"><option value="">全部分类</option><option value="display">Display</option><option value="config">Config</option><option value="verify">Verify</option></select>
              <button class="btn btn-scan" id="loadKbRuntimeBtn">筛选</button>
            </div>
            <div id="kbList"></div>
          </div>
        </div>
      </div>
      <section class="sp" id="vTopo"><div id="topoCanvas"></div><div id="topoInfo"></div></section>
      <div class="logs" id="logs" role="log" aria-live="polite"></div>
    </main>
  </div>
  <div id="renameModal" class="modal" style="display:none">
    <div class="mc">
      <div class="mt">重命名设备</div>
      <input type="text" id="renameInput" class="mi" placeholder="输入设备名称">
      <div class="mb">
        <button class="mbtn cancel" id="renameCancelBtn">取消</button>
        <button class="mbtn confirm" id="renameConfirmBtn">确定</button>
      </div>
    </div>
  </div>
  <script src="/static/socket.io.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
