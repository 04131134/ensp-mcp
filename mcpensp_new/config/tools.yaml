# eNSP-MCP Tool Definitions
# All tool descriptions in UTF-8 — no garbled text, ever.
# Adding a new tool = add one entry here + one handler function.
# mcp_server.py loads this at startup with built-in fallback.

tools:
  # ── Device Management ──
  - name: scan_devices
    description: "扫描指定端口范围的 eNSP 设备，返回开放端口列表及设备信息"
    parameters:
      start: { type: integer, default: 2000, description: "起始端口" }
      end: { type: integer, default: 2050, description: "结束端口" }

  - name: connect_device
    description: "连接 eNSP 设备，自动识别设备型号和获取主机名"
    parameters:
      port: { type: integer, required: true, description: "设备端口号(1-65535)" }

  - name: send_command
    description: "向已连接设备发送单条命令，返回结构化结果（含 cmd_success、elapsed_ms、错误诊断）"
    parameters:
      path: { type: string, required: true, description: "设备路径，格式为 127.0.0.1:端口" }
      command: { type: string, required: true, description: "要执行的命令（最多1024字符）" }

  - name: disconnect_device
    description: "断开设备连接并释放资源"
    parameters:
      path: { type: string, required: true, description: "设备路径" }

  - name: get_connected_devices
    description: "获取当前所有已连接设备的列表及状态"
    parameters: {}

  - name: rename_device
    description: "为设备设置自定义名称"
    parameters:
      path: { type: string, required: true, description: "设备路径" }
      name: { type: string, required: true, description: "新名称" }

  - name: fetch_device_name
    description: "从设备获取真实主机名（通过 display version）"
    parameters:
      path: { type: string, required: true, description: "设备路径" }

  # ── Command Execution ──
  - name: batch_command
    description: "批量发送命令到设备，自动处理视图切换和 undo terminal monitor，每次最多200条"
    parameters:
      path: { type: string, required: true, description: "设备路径" }
      commands: { type: array, items: string, required: true, description: "命令列表" }
      wait: { type: number, default: 0.1, description: "命令间隔(秒)" }
      auto_undo_tm: { type: boolean, default: true, description: "是否自动 undo t m" }

  - name: group_command
    description: "向多台设备发送相同的命令"
    parameters:
      paths: { type: array, items: string, required: true, description: "设备路径列表" }
      command: { type: string, required: true, description: "要执行的命令" }

  - name: diagnose_command
    description: "诊断命令执行失败的原因，返回错误分析和修复建议"
    parameters:
      output: { type: string, required: true, description: "命令执行的错误输出" }

  - name: diagnose_batch
    description: "批量诊断多条命令的执行结果"
    parameters:
      results: { type: array, items: object, required: true, description: "命令执行结果列表" }

  # ── Knowledge Base ──
  - name: search_kb
    description: "搜索知识库：命令记录、实验经验、排障案例、最佳实践"
    parameters:
      query: { type: string, required: true, description: "搜索关键词" }
      category: { type: string, description: "分类过滤: command/experience/template/troubleshoot/best_practice" }
      device_type: { type: string, description: "设备类型过滤" }
      limit: { type: integer, default: 20, description: "返回条数上限" }

  - name: get_kb_stats
    description: "获取知识库统计信息：总记录数、分类分布、设备类型分布"
    parameters: {}

  - name: get_config_guidance
    description: "根据配置主题获取综合指导：包含相关经验、最佳实践、排障案例、历史命令"
    parameters:
      topic: { type: string, required: true, description: "配置主题，例如 OSPF/VLAN/DHCP/WLAN/静态路由" }

  - name: record_experience
    description: "记录实验经验到知识库（实验结束后使用）"
    parameters:
      experiment: { type: string, required: true, description: "实验名称" }
      commands: { type: array, items: string, required: true, description: "成功命令列表" }
      success: { type: boolean, required: true, description: "实验是否成功" }
      lessons: { type: array, items: string, description: "经验教训" }
      device_type: { type: string, description: "设备类型" }

  - name: get_command_catalog
    description: "获取命令目录：支持的命令、参数说明、风险等级、适用设备类型"
    parameters:
      category: { type: string, description: "分类: display/config/verify/diagnostic" }
      device_type: { type: string, description: "设备类型: huawei/h3c/cisco/juniper" }

  - name: generate_lab_report
    description: "生成实验报告：包含设备配置、命令执行记录、验证结果"
    parameters:
      name: { type: string, required: true, description: "实验名称" }
      paths: { type: array, items: string, description: "设备路径列表，不指定则使用所有已连接设备" }

  # ── Device Status ──
  - name: check_device_status
    description: "检测单台设备的连接状态（TCP连通性 + 会话响应）"
    parameters:
      path: { type: string, required: true, description: "设备路径" }

  - name: check_all_status
    description: "检测所有已连接设备的状态"
    parameters: {}

  - name: status_summary
    description: "获取设备状态汇总：总数、存活数、异常数"
    parameters: {}

  # ── Topology ──
  - name: get_topology
    description: "获取拓扑摘要：节点数、链路数、节点列表"
    parameters: {}

  - name: save_topology
    description: "保存或更新拓扑数据"
    parameters:
      data: { type: object, required: true, description: "拓扑数据: {nodes: [...], links: [...]}" }

  - name: find_topology_path
    description: "查找两个节点之间的最短路径（BFS）"
    parameters:
      start: { type: string, required: true, description: "起始节点ID" }
      end: { type: string, required: true, description: "目标节点ID" }

  - name: get_topology_device
    description: "获取指定设备的邻居连接信息"
    parameters:
      node_id: { type: string, required: true, description: "节点ID" }

  # ── Configuration Methods ──
  - name: config_method_list
    description: "列出所有可用的标准配置方法（按类别组织）"
    parameters:
      category: { type: string, description: "分类: routing/switching/security/wireless/services/management" }

  - name: config_method_get
    description: "获取指定配置方法的完整信息：步骤、命令、验证方式、常见错误"
    parameters:
      method_id: { type: string, required: true, description: "配置方法ID，例如 ospf_basic/vlan_config" }

  - name: config_method_search
    description: "按关键词搜索配置方法"
    parameters:
      keyword: { type: string, required: true, description: "搜索关键词" }

  - name: config_method_steps
    description: "获取配置方法的步骤命令列表（可直接用于 batch_command）"
    parameters:
      method_id: { type: string, required: true, description: "配置方法ID" }

  - name: config_method_add
    description: "添加新的配置方法到方法库"
    parameters:
      method_data: { type: object, required: true, description: "方法数据: {id, name, category, steps, verification, ...}" }

  - name: config_method_update
    description: "更新配置方法：记录使用次数、成功率、经验教训"
    parameters:
      method_id: { type: string, required: true, description: "配置方法ID" }
      updates: { type: object, required: true, description: "要更新的字段" }
