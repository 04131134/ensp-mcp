[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ensp-mcp"
version = "3.0.0"
description = "eNSP Network Agent Runtime - MCP Server"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["mcpensp1"]
norecursedirs = [
    "python312",
    "_baseline_*",
    "backup*",
    ".git",
    "__pycache__",
    ".codex",
]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "regression_device: 需要已配置 eNSP 设备的自动生成回归测试",
]

